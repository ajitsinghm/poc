name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read        # read-only: workflow cannot push or merge
  pull-requests: write  # only used to post comments

jobs:
  # ── Go: build + test with PR comment ─────────────────────────────────────
  go-review:
    name: Go – Review
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Test with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage report
        run: go tool cover -func=coverage.out | tee coverage-summary.txt

      - name: Comment coverage on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('coverage-summary.txt', 'utf8');
            const total = summary.split('\n').find(l => l.startsWith('total:'));
            const body = [
              '## Go Coverage Report',
              '```',
              summary.trim(),
              '```',
              total ? `**${total.trim()}**` : '',
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  go-lint-review:
    name: Go – Lint Review
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint (annotate PR)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          # Inline annotations appear directly on changed lines in the PR
          only-new-issues: true

  # ── React: lint + test + build with PR comment ───────────────────────────
  react-review:
    name: React – Review
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend   # adjust if your React app lives elsewhere

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test with coverage
        run: npm test -- --watchAll=false --coverage --passWithNoTests --coverageReporters=text-summary
        id: react-test
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Comment React status on PR
        uses: actions/github-script@v7
        with:
          script: |
            const testOutcome = '${{ steps.react-test.outcome }}';
            const icon = testOutcome === 'success' ? '✅' : '❌';
            const body = [
              `## React CI Status`,
              `| Step | Status |`,
              `|------|--------|`,
              `| Lint | ✅ passed |`,
              `| Tests | ${icon} ${testOutcome} |`,
              `| Build | ✅ passed |`,
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  # ── Gate: block merge if any check fails; never auto-merges ─────────────
  all-checks:
    name: All Checks Passed – Awaiting Human Review
    runs-on: ubuntu-latest
    needs: [go-review, go-lint-review, react-review]
    if: always()

    # No 'contents: write' permission — this job cannot merge anything.
    # Merging is always a manual action by a human reviewer.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Verify all jobs passed
        id: verify
        run: |
          if [[ "${{ needs.go-review.result }}" != "success" || \
                "${{ needs.go-lint-review.result }}" != "success" || \
                "${{ needs.react-review.result }}" != "success" ]]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "One or more CI checks failed"
            exit 1
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"

      - name: Post review-required comment
        if: steps.verify.outputs.status == 'passed'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '## ✅ All CI Checks Passed',
                '',
                '> **This PR will NOT be merged automatically.**',
                '> A human reviewer must approve and merge it manually.',
                '',
                '| Check | Result |',
                '|-------|--------|',
                '| Go build & test | ✅ passed |',
                '| Go lint | ✅ passed |',
                '| React build & test | ✅ passed |',
              ].join('\n'),
            });
